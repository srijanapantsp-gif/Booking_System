<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

<body class="full-iframe-shell">

        <div class="iframe-book-button">
            <a href="book.html?id=mediterranean-marvels" class="btn btn-primary">Book Now</a>

        </div>
        <iframe title="Mediterranean Marvels – Web Promo (Holidaysify / Travefy)"
            src="https://holidaysify.com.au/discover/trip/6yw9rqurqsfzqz2a9d6u8y53tk3gxea" allowfullscreen
            allow="fullscreen" style="display: block;"
            onload="document.getElementById('iframe-loading').style.display='none';"></iframe>
